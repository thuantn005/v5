name: Build APK Android

# Build thủ công hoặc khi source app đổi. APK nằm ở mục Artifacts của lần chạy
# — tải về, mở trên điện thoại, cho phép "cài từ nguồn không xác định".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      # Repo không giữ gradle-wrapper.jar (không commit nhị phân), nên phải chỉ
      # rõ phiên bản Gradle để action tự tải về.
      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK (debug + release)
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Tải APK lên artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotto535-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
