name: Build APK Android

# Build thủ công hoặc khi source app đổi. APK nằm ở mục Artifacts của lần chạy
# — tải về, mở trên điện thoại, cho phép "cài từ nguồn không xác định".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # cần để tạo Release đính kèm APK

jobs:
  build:
    runs-on: ubuntu-latest
    # Lần chạy đầu treo 25 phút không nhúc nhích ở bước build. Đặt trần để một
    # lần treo không đốt hết hạn mức Actions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      # Cài SẴN đúng các gói AGP cần và chấp nhận license TRƯỚC. Nếu để AGP tự
      # tải lúc build, nó có thể dừng chờ người dùng gõ "y" — trên runner không
      # có ai gõ, nên job treo tới khi hết giờ.
      - name: Cài sẵn gói SDK và chấp nhận license
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # `< /dev/null` là chốt chặn thứ hai: nếu vẫn còn prompt nào, Gradle gặp
      # EOF và fail ngay thay vì treo im lặng.
      - name: Build APK (debug + release)
        working-directory: android
        run: |
          gradle assembleDebug assembleRelease \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            < /dev/null

      - name: Liệt kê APK đã tạo
        if: always()
        run: find android/app/build/outputs -name '*.apk' -printf '%p  %s bytes\n' || true

      - name: Tải APK lên artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotto535-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # Artifact chỉ tải được qua host blob của Azure, vốn bị chặn ở một số
      # mạng. Release asset nằm trên objects.githubusercontent.com — tải bằng
      # trình duyệt hay curl đều được, không cần đăng nhập.
      - name: Phát hành APK dưới dạng Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/lotto535-watcher-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/lotto535-watcher-${{ github.run_number }}-debug.apk"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dist/*.apk \
            --title "APK mới nhất (build #${{ github.run_number }})" \
            --notes "App theo dõi kỳ CHIA GIẢI Độc Đắc Lotto 5/35.

          Commit: \`${{ github.sha }}\`

          Tải file \`.apk\` bên dưới, mở trên điện thoại, cho phép cài từ nguồn
          không xác định. Bản \`-debug\` chỉ dùng khi cần xem log."
