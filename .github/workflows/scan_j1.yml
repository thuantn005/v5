name: Scan J1 Triple

on:
  workflow_dispatch:
    inputs:
      scan_start:
        description: 'Seed bắt đầu'
        default: '1'
      scan_end:
        description: 'Seed kết thúc'
        default: '500000000'
      min_j1:
        description: 'Số lần J1 tối thiểu'
        default: '3'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Quét seed J1 triple
        env:
          CSV_PATH: data/all.csv
          OUT_PATH: configs/jackpot1_triple.json
          SCAN_START: ${{ github.event.inputs.scan_start }}
          SCAN_END:   ${{ github.event.inputs.scan_end }}
          MIN_J1:     ${{ github.event.inputs.min_j1 }}
        run: python scripts/scan_j1_triple.py

      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/jackpot1_triple.json
          git diff --staged --quiet || git commit -m "scan: J1 triple seed ${{ github.event.inputs.scan_start }}-${{ github.event.inputs.scan_end }}"
          git push
