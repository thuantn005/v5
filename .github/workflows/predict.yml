name: Lotto 5/35 Predict & Notify

on:
  schedule:
    # Draws happen at 13:00 and 21:00 Vietnam time (UTC+7). We fetch in TWO
    # waves per draw so results appear fast without losing the slow jackpot data:
    #   * EARLY wave (~35 & ~65 min after the draw): the fast scrapers
    #     (lotto-8.com, xosominhngoc) already have the winning numbers by then,
    #     so the dashboard updates within ~30-60 min instead of ~2h.
    #   * LATE wave (~2h & ~2h20 after): the slower primary dataset AND the
    #     jackpot figure (which drives the "kỳ chia giải" alerts, and can take
    #     2-4h to publish) are captured. Idempotent per draw, so re-running is
    #     harmless -- whichever attempt lands does the work exactly once.
    #
    # Reliability notes (why it's laid out this way):
    #  - cron minute is intentionally NOT ":00". GitHub Actions queues every
    #    top-of-hour request at once, the single most common cause of a
    #    scheduled run firing very late or getting silently dropped.
    #  - GitHub's free scheduler is best-effort: runs can be delayed by
    #    minutes to several HOURS under load. Multiple triggers per draw +
    #    per-draw idempotency (run_pipeline.already_predicted() /
    #    multi_log.resolve_all() dedup) absorb the drift.
    #  - Scheduled workflows only run from the DEFAULT branch (main) and are
    #    auto-disabled after 60 days with no repo commits; the daily
    #    auto-commit step below keeps the schedule alive.
    # -- 13:00 ICT draw = 06:00 UTC --
    - cron: "35 6 * * *"    # ~13:35 ICT (early, ~35m after the 13:00 draw)
    - cron: "5 7 * * *"     # ~14:05 ICT (early, ~65m after)
    - cron: "7 8 * * *"     # ~15:07 ICT (late, ~2h — jackpot value)
    - cron: "27 8 * * *"    # ~15:27 ICT (late backup)
    # -- 21:00 ICT draw = 14:00 UTC --
    - cron: "35 14 * * *"   # ~21:35 ICT (early, ~35m after the 21:00 draw)
    - cron: "5 15 * * *"    # ~22:05 ICT (early, ~65m after)
    - cron: "7 16 * * *"    # ~23:07 ICT (late, ~2h — jackpot value)
    - cron: "27 16 * * *"   # ~23:27 ICT (late backup)
  workflow_dispatch: {}     # allows manual "Run workflow" button too

permissions:
  contents: write

# Serialize runs: multiple triggers per draw must not push concurrently
# (overlapping git push was causing intermittent run failures). Queue them
# instead of cancelling, so every landed run still commits exactly once.
concurrency:
  group: predict-pipeline
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest draw data
        run: python scripts/fetch_data.py

      - name: Run pipeline (build 3 tickets -> notify -> log -> resolve)
        env:
          NTFY_TOPIC: lotto535-thuan
        run: python scripts/run_pipeline.py

      - name: Notify via ntfy if any config ticket won a prize
        env:
          NTFY_TOPIC: lotto535-thuan
        run: python scripts/notify_config_wins.py --csv data/all.csv

      - name: Generate dashboard data for GitHub Pages
        run: python scripts/generate_dashboard_data.py

      - name: Generate config tickets for dashboard (Jackpot 2 – 5/5 mains)
        run: python scripts/gen_config_tickets.py --csv data/all.csv --out docs/config_tickets.json --reverify

      - name: Generate J1 config tickets for dashboard (Jackpot 1 – 5 mains + special)
        run: python scripts/gen_j1_tickets.py --csv data/all.csv --out docs/j1_tickets.json --reverify

      - name: Generate 50 seeded random tickets (+ 2 baselines) for dashboard
        run: python scripts/gen_random_tickets.py --csv data/all.csv --out docs/random_tickets.json

      - name: Commit updated data, logs & dashboard
        run: |
          git config user.name "lotto535-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all.csv state/ docs/data.json docs/config_tickets.json docs/j1_tickets.json docs/jackpot_wins.json docs/random_tickets.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."; exit 0
          fi
          git commit -m "chore: update data, model logs & dashboard [skip ci]"
          # Rebase-then-push với vài lần thử: nếu một run song song vừa push
          # trước, rebase lên rồi push lại thay vì fail.
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push bị từ chối (lần $i) → pull --rebase rồi thử lại"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          git push
