name: Kiểm tra nguồn dữ liệu

# Chạy tay: Actions -> "Kiểm tra nguồn dữ liệu" -> Run workflow.
# Thử ĐỘC LẬP từng nguồn (kết quả số, giá trị Độc Đắc, ntfy) và in báo cáo.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kiểm tra tất cả nguồn
        env:
          VIETLOTT_PROXY: ${{ secrets.VIETLOTT_PROXY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: lotto535-thuan
        run: python scripts/check_sources.py
